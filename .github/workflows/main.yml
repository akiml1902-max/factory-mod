name: Build Forge 1.20.1 Jar

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Скачиваем репозиторий
      - name: Download project
        uses: actions/checkout@v4

      # Устанавливаем Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Устанавливаем нужную версию Gradle для Forge
      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.5

      # Сборка мода
      - name: Build mod
        run: gradle build --no-daemon

      # Загружаем готовый JAR как артефакт
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Factory-Mod-1.20.1-Forge-JAR
          path: build/libs/*.jar
